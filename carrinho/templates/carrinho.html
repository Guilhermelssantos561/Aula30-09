<!DOCTYPE html>
<!-- Define que o documento é HTML5 e está no idioma Português do Brasil -->
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres UTF-8 para suporte a acentos e caracteres especiais -->
    <meta charset="UTF-8">
    
    <!-- Configura a responsividade para telas de celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título exibido na aba do navegador -->
    <title>Carrinho de Compras - FitPharma</title>

    <!-- ========================================== -->
    <!-- ESTILOS CSS DA PÁGINA                     -->
    <!-- ========================================== -->
    <style>
        /* Reset padrão: zera margens, espaçamentos e define a caixa com box-sizing */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Arial, sans-serif; 
        }

        /* Estilo do fundo da página e cor do texto principal */
        body { 
            background-color: #f4f6f9; 
            color: #333; 
        }

        /* Cabeçalho da página de carrinho (faixa azul no topo) */
        header { 
            background: #004080; 
            color: white; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* Botão laranja no cabeçalho para voltar à página inicial */
        .back-btn { 
            background: #ff9900; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            text-decoration: none; 
            font-weight: bold; 
        }

        /* Caixa central branca onde ficam a lista de compras e o total */
        .container { 
            max-width: 800px; 
            margin: 30px auto; 
            background: white; 
            border-radius: 8px; 
            padding: 30px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }

        /* Título interno do container ("Seus Produtos Selecionados") */
        h2 { 
            margin-bottom: 20px; 
            color: #004080; 
            border-bottom: 2px solid #004080; 
            padding-bottom: 5px; 
        }

        /* Remove as bolinhas/marcadores da lista <ul> de produtos */
        ul { 
            list-style: none; 
            margin-bottom: 20px; 
        }

        /* Estilo de cada item individual <li> adicionado à lista */
        li { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px 0; 
            border-bottom: 1px solid #eee; 
        }

        /* Área onde exibe o valor Total em verde */
        .total { 
            font-size: 20px; 
            font-weight: bold; 
            text-align: right; 
            margin-bottom: 30px; 
            color: #27ae60; 
        }

        /* Botão grande verde no rodapé para finalizar a compra */
        .checkout-btn { 
            background: #27ae60; 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 5px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        /* Efeito ao passar o mouse por cima do botão de finalizar */
        .checkout-btn:hover { 
            background: #219653; 
        }

        /* Estilo da mensagem exibida quando não houver itens no carrinho */
        .empty { 
            text-align: center; 
            color: #666; 
            padding: 20px; 
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- CABEÇALHO DA PÁGINA                       -->
    <!-- ========================================== -->
    <header>
        <h1>Carrinho de Compras</h1>
        <!-- Link do Django que direciona de volta para a rota 'home' -->
        <a href="{% url 'home' %}" class="back-btn">← Continuar Comprando</a>
    </header>

    <!-- ========================================== -->
    <!-- CONTAINER PRINCIPAL DO CARRINHO            -->
    <!-- ========================================== -->
    <div class="container">
        <h2>Seus Produtos Selecionados</h2>
        
        <!-- Elemento ul que receberá as li com os produtos via JavaScript -->
        <ul id="lista-carrinho">
            <!-- Os itens aparecem aqui dinamicamente via JS -->
        </ul>
        
        <!-- Elemento div onde será impresso o valor total calculado -->
        <div class="total" id="total-carrinho">Total: R$ 0,00</div>

        <!-- Botão para disparar a função JS de finalização do pedido -->
        <button class="checkout-btn" onclick="finalizarCompra()">Finalizar Pedido</button>
    </div>

    <!-- ========================================== -->
    <!-- LÓGICA JAVASCRIPT                          -->
    <!-- ========================================== -->
    <script>
        // 1. Busca os dados salvos no localStorage sob a chave 'carrinho'.
        // Se houver dados, converte de texto JSON para Array/Objetos. Se não houver nada, cria um Array vazio [].
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

        // 2. Mapeia os elementos do HTML que serão manipulados dinamicamente
        const listaElemento = document.getElementById('lista-carrinho');
        const totalElemento = document.getElementById('total-carrinho');

        /**
         * FUNÇÃO: carregarCarrinho
         * Responsável por ler o array 'carrinho', montar a lista de itens na tela e calcular o valor total.
         */
        function carregarCarrinho() {
            // Limpa todo o conteúdo visual anterior da lista <ul>
            listaElemento.innerHTML = '';

            // Se o array de produtos estiver vazio:
            if (carrinho.length === 0) {
                // Exibe a mensagem de carrinho vazio dentro da lista
                listaElemento.innerHTML = '<p class="empty">Seu carrinho está vazio.</p>';
                // Mantém o total zerado
                totalElemento.innerText = 'Total: R$ 0,00';
                // Encerra a execução da função aqui
                return;
            }

            // Variável acumuladora para guardar a soma dos preços
            let total = 0;

            // Percorre cada item armazenado no array do carrinho
            // 'item' é o objeto do produto atual; 'index' é a posição (0, 1, 2...) no array
            carrinho.forEach((item, index) => {
                // Soma o preço do produto atual à variável acumuladora total
                total += item.preco;

                // Cria dinamicamente uma nova tag <li> na memória do navegador
                const li = document.createElement('li');

                // Preenche o conteúdo HTML da tag <li> com o nome, preço formatado e o botão de exclusão [X]
                li.innerHTML = `
                    <span>${item.nome}</span>
                    <span>R$ ${item.preco.toFixed(2).replace('.', ',')} 
                        <button onclick="removerItem(${index})" style="background:#e74c3c; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; margin-left:10px;">X</button>
                    </span>
                `;

                // Insere a tag <li> criada dentro da tag <ul> (listaElemento) na página
                listaElemento.appendChild(li);
            });

            // Formata o valor total calculado para 2 casas decimais e troca o ponto por vírgula no padrão brasileiro (R$)
            totalElemento.innerText = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        /**
         * FUNÇÃO: removerItem
         * Remove um produto do carrinho com base no seu índice no Array.
         * 
         * @param {number} index - Posição do produto no array 'carrinho'
         */
        function removerItem(index) {
            // Remove 1 elemento do array a partir da posição 'index' informada
            carrinho.splice(index, 1);

            // Grava a nova versão do array atualizado de volta no localStorage do navegador
            localStorage.setItem('carrinho', JSON.stringify(carrinho));

            // Recarrega a visualização do carrinho na tela para atualizar a lista e o preço total
            carregarCarrinho();
        }

        /**
         * FUNÇÃO: finalizarCompra
         * Processa a conclusão do pedido do usuário.
         */
        function finalizarCompra() {
            // Caso o carrinho esteja sem produtos, bloqueia a finalização
            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            // Notifica o usuário sobre a conclusão bem-sucedida
            alert("Compra finalizada com sucesso! Obrigado por comprar na FitPharma.");

            // Apaga totalmente o item 'carrinho' gravado no localStorage
            localStorage.removeItem('carrinho');

            // Redireciona o usuário de volta para a página inicial
            window.location.href = 'index.html';
        }

        // Executa a função automaticamente no momento em que a página é aberta/carregada
        carregarCarrinho();
    </script>
</body>
</html>
