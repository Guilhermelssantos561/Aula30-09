<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f7f5ef] min-h-screen flex flex-col justify-between items-center p-4 relative overflow-x-hidden">

    <!-- Elementos decorativos de fundo -->
    <div class="absolute -top-20 -left-20 w-80 h-80 bg-[#e0d3b8] rounded-full blur-3xl opacity-40 pointer-events-none"></div>
    <div class="absolute top-1/3 -right-20 w-96 h-96 bg-[#cbd8f5] rounded-full blur-3xl opacity-40 pointer-events-none"></div>

    <div class="w-full flex-1 flex items-center justify-center z-10 my-8">
        <!-- Card do Formulário de Login -->
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 border border-gray-100">
            
            <!-- Logo Icon -->
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 bg-slate-800 rounded-2xl flex items-center justify-center text-amber-300 font-bold text-2xl shadow-md">
                    +
                </div>
            </div>

            <h2 class="text-3xl font-bold text-center text-gray-900 mb-6">Login</h2>

            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm font-medium text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                
                <!-- Usuário -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                        Usuário:
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" name="usuario" placeholder="Seu usuário" required
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all text-gray-800 placeholder-gray-400">
                    </div>
                </div>

                <!-- Senha -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                        Senha:
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="key-round" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="senha" name="senha" placeholder="Sua senha" required
                            class="w-full pl-11 pr-11 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all text-gray-800 placeholder-gray-400">
                        <button type="button" onclick="togglePassword('senha', 'eye-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                            <i data-lucide="eye-off" id="eye-icon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit"
                    class="w-full mt-2 bg-[#1e4a79] hover:bg-[#16375c] text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                    <span>Entrar</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">
                Não tem conta? <a href="{% url 'cadastro' %}" class="text-purple-900 font-semibold hover:underline">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="text-center text-xs text-gray-500 py-4 z-10">
        © 2026 Sua Plataforma - Todos os direitos reservados
    </footer>

    <!-- Script de Inicialização de Ícones e Visualização de Senha -->
    <script>
        lucide.createIcons();

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
