<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f7f5ef] min-h-screen flex flex-col justify-between items-center p-4 relative overflow-x-hidden">

    <!-- Elementos decorativos de fundo -->
    <div class="absolute -top-20 -left-20 w-80 h-80 bg-[#e0d3b8] rounded-full blur-3xl opacity-40 pointer-events-none"></div>
    <div class="absolute top-1/3 -right-20 w-96 h-96 bg-[#cbd8f5] rounded-full blur-3xl opacity-40 pointer-events-none"></div>

    <div class="w-full flex-1 flex items-center justify-center z-10 my-8">
        <!-- Card do Formulario -->
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 border border-gray-100">
            
            <!-- Logo Icon -->
            <div class="flex justify-center mb-4">
                <div class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center text-amber-300 font-bold text-xl shadow-md">
                    +
                </div>
            </div>
            <!-- Botão Voltar -->
            <a href="{% url 'home' %}" 
                class="inline-flex items-center gap-2 mb-6 text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Voltar à tela inicial
            </a>
            <h2 class="text-3xl font-bold text-center text-gray-900 mb-6">Criar Conta</h2>

            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm font-medium text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'cadastro' %}" class="space-y-4">
                {% csrf_token %}
                
                <!-- Usuario -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                        <i data-lucide="user" class="w-4 h-4 text-gray-500"></i>
                        Usuário:
                    </label>
                    <div class="relative">
                        <input type="text" name="usuario" placeholder="Seu nome de usuário" required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-gray-800 placeholder-gray-400">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                        <i data-lucide="mail" class="w-4 h-4 text-gray-500"></i>
                        E-mail:
                    </label>
                    <input type="email" name="email" placeholder="Seu E-mail" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-gray-800 placeholder-gray-400">
                </div>

                <!-- Senha -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                        <i data-lucide="lock" class="w-4 h-4 text-gray-500"></i>
                        Senha:
                    </label>
                    <div class="relative">
                        <input type="password" id="senha" name="senha" placeholder="Sua senha" required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-gray-800 placeholder-gray-400 pr-10">
                        <button type="button" onclick="togglePassword('senha', 'eye-icon-1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye-off" id="eye-icon-1" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <!-- Barra de Força da Senha -->
                    <div class="flex gap-1.5 mt-2">
                        <div class="h-1.5 flex-1 bg-red-400 rounded-full"></div>
                        <div class="h-1.5 flex-1 bg-amber-400 rounded-full"></div>
                        <div class="h-1.5 flex-1 bg-emerald-500 rounded-full"></div>
                    </div>
                </div>

                <!-- Confirmar Senha -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                        <i data-lucide="lock" class="w-4 h-4 text-gray-500"></i>
                        Confirmar Senha:
                    </label>
                    <input type="password" name="confirmar_senha" placeholder="Confirmar Senha" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-gray-800 placeholder-gray-400">
                </div>

                <!-- Botao Cadastrar -->
                <button type="submit"
                    class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-[0.98]">
                    Cadastrar
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">
                Já possui conta? <a href="{% url 'login' %}" class="text-blue-600 font-semibold hover:underline">Entrar</a>
            </p>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="text-center text-xs text-gray-500 py-4 z-10">
        © 2026 Sua Plataforma - Todos os direitos reservados
    </footer>

    <!-- Script para inicializar ícones e alternar exibição de senha -->
    <script>
        lucide.createIcons();

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
