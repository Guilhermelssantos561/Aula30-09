<h2>Usuários Cadastrados</h2>
<table>
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Perfil</th>
        <th>Ações</th>
    </tr>
    {% for usuario in usuarios %}
    <tr>
        <td>{{ usuario.nome }}</td>
        <td>{{ usuario.email }}</td>
        <td>{{ usuario.perfil }}</td>
        <td>
            <a href="{% url 'deletar_usuario' usuario.id %}" class="btn btn-danger">Excluir</a>
        </td>
    </tr>
    {% endfor %}
</table>
